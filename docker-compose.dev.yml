name: business-card-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DEV_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DEV_DB:-business_card}
    ports:
      - "127.0.0.1:${POSTGRES_DEV_PORT:-5433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_DEV_USER:-postgres} -d ${POSTGRES_DEV_DB:-business_card}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
